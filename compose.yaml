name: gitone-local

x-gitone: &gitone
  image: gitone-local:dev
  build:
    context: .
    target: development
  restart: unless-stopped
  env_file:
    - path: ./.local/gitone.env
      required: false # make run generates this before starting the stack
  environment: &gitone-env
    GITONE_SHARD_COUNT: "4"
    GITONE_SPACE_DISCOVERY_MODE: ${GITONE_SPACE_DISCOVERY_MODE:-indexed}
    POD_NAMESPACE: local
    GITONE_AUTH_ENABLED: "true"
    GITONE_SSH_ENABLED: "true"
    GITONE_SSH_PORT: "2222"
    GITONE_SSH_PUBLIC_URL: ssh://gitone.localhost:2222
    GITONE_SSH_HOST_KEY_FILE: /etc/gitone/ssh/host_key
    GITONE_SSH_FORWARD_KEY_FILE: /etc/gitone/ssh/forward_key
    GITONE_PUBLIC_URL: https://gitone.localhost:8443
    GITONE_OIDC_ISSUER: https://keycloak.gitone.localhost:8443/realms/gitone
    GITONE_OIDC_CLIENT_ID: gitone
    GITONE_S3_ENDPOINT: http://minio:9000
    GITONE_S3_REGION: us-east-1
    GITONE_S3_PATH_STYLE: "true"
    GITONE_S3_TLS: "false"
    GITONE_S3_BUCKET_PREFIX: gitone-local-shard
    AWS_EC2_METADATA_DISABLED: "true"
    SSL_CERT_FILE: /etc/gitone/tls/ca.crt
  volumes:
    - ./deploy/compose/cluster-identity.json:/etc/gitone/identity/cluster-identity.json:ro
    - ./.local/tls/ca.crt:/etc/gitone/tls/ca.crt:ro
    - ./.local/ssh:/etc/gitone/ssh:ro
  depends_on:
    minio-init:
      condition: service_completed_successfully
    keycloak:
      condition: service_healthy
    edge:
      condition: service_healthy
  healthcheck:
    test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/readyz]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 10s

services:
  init:
    profiles: [tools]
    build:
      context: ./deploy/compose
      dockerfile: Dockerfile.tools
    image: gitone-local-tools:dev
    command: [python3, /tools/init.py]
    volumes:
      - ./.local:/local

  minio:
    build:
      context: ./deploy/compose
      dockerfile: Dockerfile.minio
    image: gitone-local-minio:dev
    command: [server, /data, --console-address, ":9001"]
    restart: unless-stopped
    env_file:
      - path: ./.local/minio.env
        required: false
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9000/minio/health/ready]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: public.ecr.aws/aws-cli/aws-cli:2.31.18
    entrypoint: [/bin/sh, /init/minio.sh]
    env_file:
      - path: ./.local/minio.env
        required: false
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./deploy/compose:/init:ro
    depends_on:
      minio:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: [start-dev, --import-realm]
    restart: unless-stopped
    env_file:
      - path: ./.local/keycloak.env
        required: false
    environment:
      KC_HOSTNAME: https://keycloak.gitone.localhost:8443
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./.local/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; cat <&3 | grep -q \"200 OK\"'"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  edge:
    image: nginx:1.28.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deploy/compose/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./.local/tls/server.key:/etc/nginx/tls/server.key:ro
    networks:
      default:
        aliases: [gitone.localhost, keycloak.gitone.localhost]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 12

  gitone-0:
    <<: *gitone
    ports:
      - "127.0.0.1:2222:2222"
    environment:
      <<: *gitone-env
      POD_NAME: gitone-0
    networks:
      default:
        aliases: [gitone-0.gitone-headless.local.svc]
  gitone-1:
    <<: *gitone
    environment:
      <<: *gitone-env
      POD_NAME: gitone-1
    networks:
      default:
        aliases: [gitone-1.gitone-headless.local.svc]
  gitone-2:
    <<: *gitone
    environment:
      <<: *gitone-env
      POD_NAME: gitone-2
    networks:
      default:
        aliases: [gitone-2.gitone-headless.local.svc]
  gitone-3:
    <<: *gitone
    environment:
      <<: *gitone-env
      POD_NAME: gitone-3
    networks:
      default:
        aliases: [gitone-3.gitone-headless.local.svc]

  smoke:
    profiles: [tools]
    image: gitone-local-tools:dev
    build:
      context: ./deploy/compose
      dockerfile: Dockerfile.tools
    command: [python3, /tools/smoke.py]
    volumes:
      - ./.local/tls/ca.crt:/local/ca.crt:ro

volumes:
  minio-data:
  keycloak-data:
