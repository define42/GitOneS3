# shardCount is both the StatefulSet replica count and the permanent routing
# modulus. Changing it after the immutable identity ConfigMap is installed is a
# data migration, not a Helm upgrade.
shardCount: 256

image:
  repository: gitone
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
podAnnotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  publicPort: 8080
  internalScheme: http
  headlessName: gitone-headless
  annotations: {}

listenAddress: 0.0.0.0

# Existing stores: deploy all writers in scan mode, backfill every shard, then
# switch to indexed. See docs/space-discovery.md before upgrading.
spaceDiscoveryMode: indexed

# Shared per-shard HTTP/SSH limits. Measure peak container memory on your largest
# repositories before raising active concurrency; GOMEMLIMIT is only a soft limit.
git:
  maxConcurrentOperations: 1
  maxQueuedOperations: 4
  queueTimeout: 5s

# LFS bytes stream through GitOne with an 8MiB multipart buffer per upload.
lfs:
  enabled: true
  maxObjectBytes: 1GiB
  maxRepositoryBytes: 10GiB
  maxConcurrentTransfers: 4
  maxQueuedTransfers: 8
  queueTimeout: 5s
  transferTimeout: 30m

# Opt in to /system/metrics with a separately provisioned bearer token.
# The token must have at least 32 ASCII bytes. Empty existingSecret disables HTTP scrapes.
metrics:
  existingSecret: ""
  secretKey: metrics-token

ssh:
  enabled: false
  port: 2222
  servicePort: 22
  publicURL: ""
  # Shared across shards, with distinct Ed25519 private keys host-key and forward-key.
  existingSecret: ""

auth:
  enabled: false
  # HTTPS origin, without a trailing slash.
  publicURL: ""
  googleClientID: ""
  # Must have google-client-secret, cookie-hash-key, and cookie-block-key.
  # Cookie keys are base64-encoded 64-byte and 32-byte random keys respectively.
  # All shards must use the same keys.
  existingSecret: ""

s3:
  # Leave endpoint empty to use the AWS SDK endpoint for region.
  endpoint: ""
  region: us-east-1
  pathStyle: false
  tls: true
  bucketPrefix: gitone-shard

clusterIdentity:
  mountPath: /etc/gitone/identity

pack:
  compactOnPush: true
  maxPackCount: 32
  maxSmallPackCount: 16
  smallPackThreshold: 128MiB
  liveCompaction:
    maxInputBytes: 2GiB
    maxInputPacks: 32

path:
  maxTopLevelLength: 63
  maxComponentLength: 255
  maxDepth: 32

cache:
  sizeLimit: 20Gi

workspace:
  sizeLimit: 50Gi

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gitone

nodeSelector: {}
tolerations: []

networkPolicy:
  enabled: true
  # Declare S3, workload-identity, metadata, and credential-broker destinations
  # separately when they use different ports. The broad default is portable,
  # but is not a production boundary.
  externalEgress:
    - cidr: 0.0.0.0/0
      port: 443

pdb:
  # One pod is the only owner of each shard. Enabling this PDB with
  # maxUnavailable=1 still permits one shard outage; maxUnavailable=0 blocks
  # voluntary disruption and can impede controlled updates.
  enabled: false
  maxUnavailable: 1

terminationGracePeriodSeconds: 120
