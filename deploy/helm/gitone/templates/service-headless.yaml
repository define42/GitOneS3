apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.headlessName }}
  labels:
    {{- include "gitone.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    {{- include "gitone.selectorLabels" . | nindent 4 }}
  ports:
    - name: public
      protocol: TCP
      port: {{ .Values.service.publicPort }}
      targetPort: public
