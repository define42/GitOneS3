{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitone
  labels:
    {{- include "gitone.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gitone.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.publicPort }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "gitone.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.publicPort }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.networkPolicy.externalEgress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
{{- end }}
