# Docker DNS allows startup before GitOne and follows replacement containers.
log_format without_secrets '$remote_addr "$request_method $uri" $status';
access_log /var/log/nginx/access.log without_secrets;
resolver 127.0.0.11 valid=5s ipv6=off;
upstream gitone {
    zone gitone 64k;
    server gitone-0:8080 resolve;
    server gitone-1:8080 resolve;
    server gitone-2:8080 resolve;
    server gitone-3:8080 resolve;
}
upstream keycloak {
    zone keycloak 64k;
    server keycloak:8080 resolve;
}

server {
    listen 8080;
    location = /healthz { access_log off; return 200 'ok\n'; }
}

server {
    listen 8443 ssl;
    server_name gitone.localhost localhost;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 0;

    location = / {
        default_type text/plain;
        return 200 'GitOne local development stack\n\nLogin: https://gitone.localhost:8443/alice/auth/oidc/login\nDemo users: alice / alice-dev-password, bob / bob-dev-password\nKeycloak: https://keycloak.gitone.localhost:8443/admin/\n';
    }
    location / {
        proxy_pass http://gitone;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 8443 ssl;
    server_name keycloak.gitone.localhost;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
